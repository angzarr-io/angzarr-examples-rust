# Architecture rules for angzarr-examples-rust, checked by `just archlint`
# (tools/archlint; pattern syntax and rule semantics in
# tools/archlint/src/rules.rs). `cargo run -p archlint -- --edges` prints the
# module graph these rules are checked against.
#
# The workspace currently holds only the linter itself. Each example crate
# brings its own layer rules when it joins the workspace; a rule whose
# `from` matches no module is reported as stale, so rules are added with the
# code they constrain.

[[rule]]
name = "tooling-is-self-contained"
why = "the architecture linter reads example code from disk; it never links an example crate, the client, or a submodule checkout"
from = ["archlint::**"]
allow = ["archlint::**"]
deny = ["angzarr_client::**", "path:angzarr-client-rust/**", "path:angzarr-project/**"]

[[rule]]
name = "generated-types-are-a-leaf"
why = "examples-proto is the generated layer only (wire types and the markup domain layer over them): every component links it, so it links no example crate and no framework client"
from = ["examples_proto::**"]
allow = ["examples_proto::**"]
deny = ["angzarr_client::**"]

[[rule]]
name = "the-table-names-the-runtime-only-through-its-generated-layer"
why = "agg-table is the table's logic: its generated interface implemented over the generated domain layer, whose context and failure types are the only runtime it names; it marks nothing up and links no framework directly, so the generated adapter is the one place the markup is"
from = ["agg_table::**"]
allow = ["agg_table::**", "examples_proto::**", "angzarr_embedded_diagnostic::**"]
deny = ["angzarr_client::**", "angzarr_embedded::**", "angzarr_embedded_macros::**", "tonic::**"]

[[rule]]
name = "the-shoe-knows-only-cards"
why = "the shoe is the cards.proto algorithm alone; the table's state and decisions build on it, never the reverse"
from = ["agg_table::shoe"]
allow = ["examples_proto::**"]
scope = "lib"

[[rule]]
name = "the-embedded-table-is-generated-wiring-over-the-logic"
why = "table-embedded is the table's generated angzarr-embedded adapter and register() (build.rs), and the two policies' markup delegating to table-player-policies; the logic stays in agg-table and table-player-policies, so nothing here restates it, and it links no other example crate or framework client"
from = ["table_embedded::**"]
allow = ["table_embedded::**", "agg_table::**", "table_player_policies::**", "examples_proto::**"]
deny = ["angzarr_client::**", "tonic::**"]

[[rule]]
name = "the-policies-are-framework-free"
why = "the table-player policies are plain functions over the generated domain types, so any harness adapter can delegate to them without the logic linking it"
from = ["table_player_policies::**"]
allow = ["table_player_policies::**", "examples_proto::**"]
deny = ["angzarr_client::**", "angzarr_embedded::**", "angzarr_embedded_macros::**", "tonic::**"]
