# CI-specific overrides for Helm deployment
# Used in addition to values.yaml when deploying in CI

# Image pull secret for GHCR
imagePullSecrets:
  - name: ghcr-pull-secret

# Init containers use host/port for health checks (nc -z).
# postgres-simple / rabbitmq-simple name their Service after the helm
# release, and justfile's deploy-infra uses `angzarr-db`/`angzarr-mq`
# as the release names (since b7f0d47, Apr 8). The production path
# (cloudnative-pg + rabbitmq operator) also uses those names.
storage:
  postgres:
    uri: "postgres://angzarr:angzarr@angzarr-db:5432/angzarr"
    host: "angzarr-db"
    port: 5432

messaging:
  amqp:
    url: "amqp://angzarr:angzarr@angzarr-mq:5672/%2F"
    host: "angzarr-mq"
    port: 5672

# Coordinator images — pinned by digest for supply-chain safety.
# aggregate/saga/projector/processManager/gateway track core main
# (angzarr-aggregate, etc. — built with otel,postgres,amqp features).
# stream/log stay on the 2026-02-22 -dev pins — core skaffold.yaml
# doesn't build them, and they don't need the missing features.
# Refs match the acceptance-callable.yml coordinator pull step that
# pre-loads these into Kind. IfNotPresent so the Kind-loaded image
# is used without a re-pull.
images:
  aggregate:
    repository: ghcr.io/angzarr-io/angzarr-aggregate
    tag: "0f30747@sha256:df8738f30e60ad7d3d571982169470cacd7a867d87a43c807bca54f487139d7f"
    pullPolicy: IfNotPresent
  saga:
    repository: ghcr.io/angzarr-io/angzarr-saga
    tag: "0f30747@sha256:afbfb589653988bb1f63890904c21dc135ea51fcffd702e17a62233aac068b6a"
    pullPolicy: IfNotPresent
  projector:
    repository: ghcr.io/angzarr-io/angzarr-projector
    tag: "0f30747@sha256:ce1ee6f99455ec0e84a4e517d660c57bbea54f8865f2da4de0ca259b42f4b4a2"
    pullPolicy: IfNotPresent
  processManager:
    repository: ghcr.io/angzarr-io/angzarr-process-manager
    tag: "0f30747@sha256:7455baea1e08b8cea5822349c83a182716ea21e506232b1ec5e62d27f1fe04a0"
    pullPolicy: IfNotPresent
  stream:
    repository: ghcr.io/angzarr-io/angzarr-stream-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f"
    pullPolicy: IfNotPresent
  log:
    repository: ghcr.io/angzarr-io/angzarr-log-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
    pullPolicy: IfNotPresent

# grpc-gateway is under infrastructure in the chart
infrastructure:
  gateway:
    image:
      repository: ghcr.io/angzarr-io/angzarr-grpc-gateway
      tag: "0f30747@sha256:90841587573d6b936c919adc4d7a64cadadaefedd3d735db051fc329cd5b8164"
      pullPolicy: IfNotPresent

# Override applications with pullPolicy for CI (images loaded into Kind)
# Note: agg-tournament excluded — not built in CI (no Containerfile target)
applications:
