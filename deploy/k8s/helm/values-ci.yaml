# CI-specific overrides for Helm deployment
# Used in addition to values.yaml when deploying in CI

# Image pull secret for GHCR
imagePullSecrets:
  - name: ghcr-pull-secret

# Init containers use host/port for health checks (nc -z).
# postgres-simple / rabbitmq-simple name their Service after the helm
# release, and justfile's deploy-infra uses `angzarr-db`/`angzarr-mq`
# as the release names (since b7f0d47, Apr 8). The production path
# (cloudnative-pg + rabbitmq operator) also uses those names.
storage:
  postgres:
    uri: "postgres://angzarr:angzarr@angzarr-db:5432/angzarr"
    host: "angzarr-db"
    port: 5432

messaging:
  amqp:
    url: "amqp://angzarr:angzarr@angzarr-mq:5672/%2F"
    host: "angzarr-mq"
    port: 5672

# Coordinator images — pinned by digest for supply-chain safety.
# aggregate/saga/projector/processManager/gateway track core main
# (angzarr-aggregate, etc. — built with otel,postgres,amqp features).
# stream/log stay on the 2026-02-22 -dev pins — core skaffold.yaml
# doesn't build them, and they don't need the missing features.
# Refs match the acceptance-callable.yml coordinator pull step that
# pre-loads these into Kind. IfNotPresent so the Kind-loaded image
# is used without a re-pull.
images:
  aggregate:
    repository: ghcr.io/angzarr-io/angzarr-aggregate
    tag: "e6f0e50@sha256:3d0825178a38e60b056952ca13f1dc0b0cbe3367c63461f56d83eb3115a23e40"
    pullPolicy: IfNotPresent
  saga:
    repository: ghcr.io/angzarr-io/angzarr-saga
    tag: "e6f0e50@sha256:0e265cd455eca3e9dd1a5f0a4fcdf0e1b75b9c1286d55dab9802cc03fddfe780"
    pullPolicy: IfNotPresent
  projector:
    repository: ghcr.io/angzarr-io/angzarr-projector
    tag: "e6f0e50@sha256:81173335c75886cb0b1c5f5435c5b4997b030b109a3d552c63fbb1596939d989"
    pullPolicy: IfNotPresent
  processManager:
    repository: ghcr.io/angzarr-io/angzarr-process-manager
    tag: "e6f0e50@sha256:d14f6d764857f80e0d693ec1697cb5cfe09f98ce449bc9896c090ad9633ee7ef"
    pullPolicy: IfNotPresent
  stream:
    repository: ghcr.io/angzarr-io/angzarr-stream-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f"
    pullPolicy: IfNotPresent
  log:
    repository: ghcr.io/angzarr-io/angzarr-log-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
    pullPolicy: IfNotPresent

# grpc-gateway is under infrastructure in the chart
infrastructure:
  gateway:
    image:
      repository: ghcr.io/angzarr-io/angzarr-grpc-gateway
      tag: "e6f0e50@sha256:2e1ebc5e1c4bea8cca2b27b1ab90a0d4010ff4c1986cd53ed1fe7bab367ae35d"
      pullPolicy: IfNotPresent

# Override applications with pullPolicy for CI (images loaded into Kind)
# Note: agg-tournament excluded — not built in CI (no Containerfile target)
applications:
  business:
    - name: agg-player
      image:
        repository: ghcr.io/angzarr-io/examples-rust-agg-player
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "player"
      port: 50001

    - name: agg-table
      image:
        repository: ghcr.io/angzarr-io/examples-rust-agg-table
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "table"
      port: 50002

    - name: agg-hand
      image:
        repository: ghcr.io/angzarr-io/examples-rust-agg-hand
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "hand"
      port: 50003

  sagas:
    - name: saga-table-hand
      image:
        repository: ghcr.io/angzarr-io/examples-rust-saga-table-hand
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "table-hand"
      port: 50011
      topics:
        - "table.*"

    - name: saga-hand-player
      image:
        repository: ghcr.io/angzarr-io/examples-rust-saga-hand-player
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "hand-player"
      port: 50014
      topics:
        - "hand.*"

  processManagers:
    - name: pmg-hand-flow
      image:
        repository: ghcr.io/angzarr-io/examples-rust-pmg-hand-flow
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "pmg-hand-flow"
      port: 50391
      topics:
        - "table.*"
        - "hand.*"

    # Reservation refactor (was 3 separate PMs: pmg-buy-in / pmg-rebuy /
    # pmg-registration) — single PM keyed by reservation_id, sourcing
    # reservation/table/tournament events.
    - name: pmg-reservation
      image:
        repository: ghcr.io/angzarr-io/examples-rust-pmg-reservation
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "pmg-reservation"
      port: 50392
      topics:
        - "reservation.*"
        - "table.*"
        - "tournament.*"

  projectors:
    - name: prj-output
      image:
        repository: ghcr.io/angzarr-io/examples-rust-prj-output
        tag: "latest"
        pullPolicy: IfNotPresent
      domain: "output"
      port: 50030
      topics:
        - "player.*"
        - "table.*"
        - "hand.*"
        - "tournament.*"
