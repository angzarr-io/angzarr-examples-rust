# CI-specific overrides for Helm deployment
# Used in addition to values.yaml when deploying in CI

# Image pull secret for GHCR
imagePullSecrets:
  - name: ghcr-pull-secret

# Init containers use host/port for health checks (nc -z)
# CI infra is installed via the `angzarr-db-postgres-simple` and
# `angzarr-mq-rabbitmq-simple` charts, whose services are plain
# `postgres`/`rabbitmq`. The production path (cloudnative-pg + rabbitmq
# operator) uses `angzarr-db`/`angzarr-mq` and overrides these in its own
# values file.
storage:
  postgres:
    uri: "postgres://angzarr:angzarr@postgres:5432/angzarr"
    host: "postgres"
    port: 5432

messaging:
  amqp:
    url: "amqp://angzarr:angzarr@rabbitmq:5672/%2F"
    host: "rabbitmq"
    port: 5672

# Coordinator images — pinned by digest for supply-chain safety.
# The release-named packages (angzarr-aggregate, -saga, …) have no
# versions on ghcr yet; use the -dev packages until the release
# pipeline is set up. grpc-gateway has no -dev variant; pin to its
# only published build. Refs match the acceptance-callable.yml
# coordinator pull step that pre-loads these into Kind.
# IfNotPresent so the Kind-loaded image is used without a re-pull.
images:
  aggregate:
    repository: ghcr.io/angzarr-io/angzarr-aggregate-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:5349d55cc56291f435eb21d660e115c8f17b58f6ce4d265c1a1b4158045ea78b"
    pullPolicy: IfNotPresent
  saga:
    repository: ghcr.io/angzarr-io/angzarr-saga-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:ea7ec02f56ff64ccae6942727b95fb34703b4d99ff9a16c215cc325fd8addc01"
    pullPolicy: IfNotPresent
  projector:
    repository: ghcr.io/angzarr-io/angzarr-projector-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:fdfd8fbc39b5465777e3cf7edd6096298fb8e25d04164fdd3670ffecb945e9a7"
    pullPolicy: IfNotPresent
  processManager:
    repository: ghcr.io/angzarr-io/angzarr-process-manager-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf447d15c78f3b6c685e8064bc7c09162f53719a069cc42a1ee655a18cc04702"
    pullPolicy: IfNotPresent
  stream:
    repository: ghcr.io/angzarr-io/angzarr-stream-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f"
    pullPolicy: IfNotPresent
  log:
    repository: ghcr.io/angzarr-io/angzarr-log-dev
    tag: "ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
    pullPolicy: IfNotPresent

# grpc-gateway is under infrastructure in the chart
infrastructure:
  gateway:
    image:
      repository: ghcr.io/angzarr-io/angzarr-grpc-gateway
      tag: "bf4fa78@sha256:208379ef32cd63d032aeca9c994a9a034e74ba04f115a03195a36f393335fe38"
      pullPolicy: IfNotPresent

