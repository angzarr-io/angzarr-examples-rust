[package]
name = "poker-tests"
version = "0.1.0"
edition = "2021"

[lib]
name = "poker_tests"
path = "src/lib.rs"

[features]
default = []
acceptance-test = ["tonic", "tokio-stream"]

[dependencies]
examples-proto.workspace = true
examples-utils.workspace = true
angzarr-client.workspace = true
agg-player = { path = "../player/agg" }
agg-table = { path = "../table/agg" }
agg-hand = { path = "../hand/agg" }
agg-tournament = { path = "../tournament/agg" }
agg-reservation = { path = "../reservation/agg" }
pmg-reservation = { path = "../pmg-reservation" }
pmg-hand-flow = { path = "../pmg-hand-flow" }
saga-table-hand = { path = "../table/saga-hand" }
saga-hand-table = { path = "../hand/saga-table" }
saga-table-player = { path = "../table/saga-player" }
saga-hand-player = { path = "../hand/saga-player" }
saga-player-table = { path = "../player/saga-table" }
hex = { workspace = true }
cucumber = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
prost = { workspace = true }
prost-types = { workspace = true }
sha2 = "0.10"
regex = "1"
tonic = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4", "v5"] }

# Aggregate BDD test targets on Tier 5 Router API.
# Acceptance target still pending port. Tracked in TASKS.md.
[[test]]
name = "player"
harness = false
[[test]]
name = "table"
harness = false
[[test]]
name = "hand"
harness = false
[[test]]
name = "orchestration"
harness = false
[[test]]
name = "saga"
harness = false
[[test]]
name = "process_manager"
harness = false
[[test]]
name = "projector"
harness = false
[[test]]
name = "betting_round"
harness = false
[[test]]
name = "game_rules"
harness = false
[[test]]
name = "raise_tracking"
harness = false
[[test]]
name = "tournament"
harness = false
# Unit-tier BDD target: runs features/example/unit/poker_game.feature and
# sync_modes.feature against InProcessClient. No env vars, no features.
[[test]]
name = "poker_game_unit"
harness = false
# Cluster acceptance BDD target: runs features/example/acceptance/*.feature
# against a deployed cluster via gRPC. Requires --features acceptance-test.
[[test]]
name = "acceptance"
harness = false
