# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install (again after a hook is added or removed here: pre-push was)
# Bypass: none — fix the finding instead.

# Plant the in-submodule pre-commit guard (angzarr-project/submodule.just's
# install-submodule-hooks, imported by the justfile) after checkouts and
# merges.
#
# A fresh clone or `git worktree add` runs post-checkout before any
# submodule is checked out: angzarr-project/submodule.just is not there, so
# the justfile's `import?` brings no `install-submodule-hooks`, and there is
# no submodule checkout to guard either. The step says so, and how to
# install the guard once the submodules are checked out; with
# submodule.just there, the recipe runs and its failure fails the hook.
post-checkout:
  commands:
    install-submodule-hooks:
      run: &install-submodule-hooks >-
        if [ -f angzarr-project/submodule.just ]; then just install-submodule-hooks;
        else echo "no submodule guard installed: angzarr-project is not checked out (git submodule update --init, then just install-submodule-hooks)";
        fi

post-merge:
  commands:
    install-submodule-hooks:
      run: *install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    check-submodules-clean:
      # git exports GIT_DIR/GIT_INDEX_FILE to hooks in linked worktrees,
      # which would make `git -C <submodule>` inspect the parent instead.
      run: env -u GIT_DIR -u GIT_INDEX_FILE just check-submodules-clean
    # Refuse commits whose staged files contain secrets (gitleaks).
    scan-secrets:
      run: just scan-secrets
    # Module-level layer rules (archlint.toml) over the Rust workspace.
    archlint:
      glob: "*.{rs,toml}"
      run: just archlint
    fmt:
      glob: "*.rs"
      run: just fmt-fix
      stage_fixed: true
    # Clippy, warnings denied: the complexity gate (cognitive_complexity,
    # too_many_lines, excessive_nesting; Cargo.toml and clippy.toml) and
    # every other lint, over every target of the workspace, tests and
    # agg-table's test-support included.
    lint:
      glob: "*.{rs,toml}"
      run: just lint

# No mutation testing in any hook: it runs while tests are written and judged
# (`just mutation-push`, by hand), at the end of an unattended run, and in the
# scheduled CI full pass (`mutation-test`, .github/workflows/mutation.yml).

# Red tests never reach the default branch: `just push-check` runs every test
# in each pushed commit's own tree (the justfile says how), refusing a push
# to the default branch whose tests fail and warning on any other branch.
# git's pushed refs are on stdin, and {1} is the remote's name. lefthook
# skips a pre-push command when it finds no files changed between HEAD and
# the remote, which says nothing of the refs pushed; a `{files}` in `run`
# turns that off, so `files` names one that is always there, and push-check
# ignores it.
pre-push:
  commands:
    push-check:
      use_stdin: true
      files: echo justfile
      run: just push-check {1} {files}
