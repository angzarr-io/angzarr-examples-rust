# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install (again after a hook is added here: pre-push was)
# Bypass: none — fix the finding instead.

post-checkout:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

post-merge:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    check-submodules-clean:
      # git exports GIT_DIR/GIT_INDEX_FILE to hooks in linked worktrees,
      # which would make `git -C <submodule>` inspect the parent instead.
      run: env -u GIT_DIR -u GIT_INDEX_FILE just check-submodules-clean
    # Refuse commits whose staged files contain secrets (gitleaks).
    scan-secrets:
      run: just scan-secrets
    # Module-level layer rules (archlint.toml) over the Rust workspace.
    archlint:
      glob: "*.{rs,toml}"
      run: just archlint
    fmt:
      glob: "*.rs"
      run: just fmt-fix
      stage_fixed: true

# Mutation testing runs here, not at pre-commit: it is too slow for every
# commit. `just mutation-push` mutates what each pushed ref adds, in the pushed
# commit's own tree (the justfile says how), judged per crate
# (justfile.container's MUTATION_THRESHOLDS). git's pushed refs are on stdin,
# and {1} is the remote's name. lefthook skips a pre-push command when it finds
# no files changed between HEAD and the remote, which says nothing of the refs
# pushed; a `{files}` in `run` turns that off, so `files` names one that is
# always there, and mutation-push ignores it.
pre-push:
  commands:
    mutation:
      use_stdin: true
      files: echo justfile
      run: just mutation-push {1} {files}
