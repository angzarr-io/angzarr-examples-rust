name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [client-updated]  # Triggered by angzarr-client-rust on update
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/angzarr-io/examples-rust
  # Opt into Node.js 24 for GitHub Actions (required after June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Unbypassable guard against `--no-verify` / `LEFTHOOK=0` locally. Mirrors
  # the parent-side check that lefthook runs on pre-commit. Pointer-only
  # bumps pass; dirty submodule working trees fail.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Verify submodules are clean
        run: just check-submodules-clean

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [submodules]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # fetched manually below without --depth=1

      - name: Fetch submodules (unshallow; avoids HTTP 500 direct-fetch path)
        run: git submodule update --init

      - name: Init nested angzarr-project submodule (non-recursive)
        run: git -C angzarr-client-rust submodule update --init angzarr-project

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Update client dependency (on dispatch)
        if: github.event_name == 'repository_dispatch' && hashFiles('Cargo.toml') != ''
        run: cargo update angzarr-client

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Use justfile.container directly (CI runs without container wrapper)
      - name: Build
        run: just -f justfile.container build

      - name: Test
        run: just -f justfile.container test

      - name: Lint
        run: just -f justfile.container lint

      - name: Format check
        run: just -f justfile.container fmt

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

          # All jobs must pass to merge
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
