name: Acceptance Tests (Callable)

# Reusable workflow for running Kind-based acceptance tests.
# Can be called by:
# - This repo's CI (with just-built example images)
# - Core repo CI (with just-built coordinator images)
# - Client repo CI (with default images)

on:
  workflow_call:
    inputs:
      coordinator-version:
        description: 'Version tag for coordinator images (e.g., v1.0.0 or pr-123-abc1234)'
        required: true
        type: string
      example-images:
        description: 'JSON object of example image refs. Empty = build locally.'
        required: false
        default: '{}'
        type: string
      examples-ref:
        description: 'Git ref for examples repo checkout'
        required: false
        default: 'main'
        type: string
    secrets:
      GHCR_TOKEN:
        description: 'Token for pulling coordinator images from ghcr.io (optional, uses github.token if not provided)'
        required: false

env:
  CARGO_TERM_COLOR: always
  EXAMPLES_PROTO_ROOT: ${{ github.workspace }}/examples-proto
  ANGZARR_PROTO_ROOT: ${{ github.workspace }}/angzarr-proto
  # Opt into Node.js 24 for GitHub Actions (required after June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    name: Kind Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Determine checkout ref
        id: ref
        run: |
          REF="${{ inputs.examples-ref }}"
          # For PR refs (refs/pull/N/merge), use directly - GitHub generates these
          if [[ "$REF" == refs/pull/* ]]; then
            echo "ref=$REF" >> $GITHUB_OUTPUT
            echo "Using PR ref: $REF"
          # For branch names, verify they exist
          elif git ls-remote --exit-code https://github.com/angzarr-io/angzarr-examples-rust.git "$REF" >/dev/null 2>&1; then
            echo "ref=$REF" >> $GITHUB_OUTPUT
            echo "Using requested ref: $REF"
          else
            echo "ref=main" >> $GITHUB_OUTPUT
            echo "Ref '$REF' not found, falling back to main"
          fi

      - name: Checkout examples repo
        uses: actions/checkout@v4
        with:
          repository: angzarr-io/angzarr-examples-rust
          ref: ${{ steps.ref.outputs.ref }}
          submodules: true

      - name: Install tools
        run: |
          # Install just
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Export protos from submodule
        run: |
          # Layout must match proto imports ("examples/poker_types.proto"),
          # so keep the examples/ prefix rather than flattening.
          buf export angzarr-project/proto -o _proto_export
          rm -rf angzarr-proto examples-proto
          cp -r _proto_export angzarr-proto
          mkdir -p examples-proto/examples
          cp _proto_export/examples/*.proto examples-proto/examples/
          rm -rf _proto_export

      - name: Parse image inputs
        id: images
        env:
          VERSION: ${{ inputs.coordinator-version }}
        run: |
          # Build coordinator images JSON from version
          COORD=$(cat <<EOF
          {
            "aggregate": "ghcr.io/angzarr-io/angzarr-aggregate-dev:ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:5349d55cc56291f435eb21d660e115c8f17b58f6ce4d265c1a1b4158045ea78b",
            "saga": "ghcr.io/angzarr-io/angzarr-saga-dev:ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:ea7ec02f56ff64ccae6942727b95fb34703b4d99ff9a16c215cc325fd8addc01",
            "projector": "ghcr.io/angzarr-io/angzarr-projector-dev:ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:fdfd8fbc39b5465777e3cf7edd6096298fb8e25d04164fdd3670ffecb945e9a7",
            "process-manager": "ghcr.io/angzarr-io/angzarr-process-manager-dev:ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf447d15c78f3b6c685e8064bc7c09162f53719a069cc42a1ee655a18cc04702",
            "stream": "ghcr.io/angzarr-io/angzarr-stream-dev:ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bb0bb16dc8b1039ba0cf63f38e6dbea380a389fbaae3143deaf70b4e0c38778f",
            "gateway": "ghcr.io/angzarr-io/angzarr-grpc-gateway:bf4fa78@sha256:208379ef32cd63d032aeca9c994a9a034e74ba04f115a03195a36f393335fe38",
            "log": "ghcr.io/angzarr-io/angzarr-log-dev:ba4fcd4a767165f56aadd2bfbf2b294a59394800@sha256:bf96d6a207d9328c3792c6d15d8a06eee2b3711b81beb74809bde41e20cfdf64"
          }
          EOF
          )
          echo "coordinators=$(echo "$COORD" | jq -c '.')" >> $GITHUB_OUTPUT
          echo "Using coordinator version: ${VERSION}"

          # Example images - use provided or build locally
          EXAMPLES='${{ inputs.example-images }}'
          if [ "$EXAMPLES" = "{}" ] || [ -z "$EXAMPLES" ]; then
            echo "build-examples=true" >> $GITHUB_OUTPUT
            echo "examples={}" >> $GITHUB_OUTPUT
          else
            echo "build-examples=false" >> $GITHUB_OUTPUT
            echo "examples=$(echo "$EXAMPLES" | jq -c '.')" >> $GITHUB_OUTPUT
          fi

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: angzarr-test
          config: deploy/kind/cluster.yaml
          node_image: kindest/node:v1.31.0
          wait: 120s

      - name: Create namespace
        run: kubectl create namespace angzarr-test --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        env:
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="${REGISTRY_TOKEN}" \
            --namespace=angzarr-test \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n angzarr-test \
            -p '{"imagePullSecrets": [{"name": "ghcr-pull-secret"}]}' || true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Log in to Helm registry
        run: echo "${{ secrets.GHCR_TOKEN || github.token }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and load coordinator images
        # Refs are 'repo:tag@sha256:digest'; docker verifies by digest on
        # pull. kind load takes a tag ref (no @digest) so we retag the
        # pulled image under repo:tag before loading.
        run: |
          IMAGES='${{ steps.images.outputs.coordinators }}'
          echo "Pulling coordinator images..."
          echo "$IMAGES" | jq -r 'to_entries[] | "\(.key): \(.value)"'
          echo "$IMAGES" | jq -r 'to_entries[] | .value' | while read ref; do
            echo "Pulling $ref..."
            docker pull "$ref"
            tagged="${ref%@sha256:*}"
            docker tag "$ref" "$tagged"
            kind load docker-image "$tagged" --name angzarr-test
          done

      - name: Build example images (if not provided)
        id: build-examples
        if: steps.images.outputs.build-examples == 'true'
        run: |
          echo "Building example images locally..."
          # Install skaffold
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/

          # Build without pushing
          skaffold build --push=false --file-output=build.json

          # Load into Kind and re-tag as :latest for Helm
          jq -r '.builds[].tag' build.json | while read img; do
            echo "Loading $img into Kind..."
            kind load docker-image "$img" --name angzarr-test
            # Extract base image name and tag as :latest
            base=$(echo "$img" | cut -d: -f1)
            echo "Tagging $base:latest..."
            docker tag "$img" "$base:latest"
            kind load docker-image "$base:latest" --name angzarr-test
          done

      - name: Download image artifacts
        if: steps.images.outputs.build-examples == 'false' && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/images
          pattern: image-*

      - name: Load example images from artifacts (PR)
        if: steps.images.outputs.build-examples == 'false' && github.event_name == 'pull_request'
        run: |
          for tarball in /tmp/images/image-*/*.tar; do
            echo "Loading $tarball..."
            kind load image-archive "$tarball" --name angzarr-test
          done

      - name: Pull and load provided example images (push)
        if: steps.images.outputs.build-examples == 'false' && github.event_name != 'pull_request'
        run: |
          IMAGES='${{ steps.images.outputs.examples }}'
          echo "Pulling provided example images..."
          echo "$IMAGES" | jq -r 'to_entries[] | "\(.key): \(.value)"'
          echo "$IMAGES" | jq -r 'to_entries[] | .value' | while read img; do
            echo "Pulling $img..."
            docker pull "$img"
            kind load docker-image "$img" --name angzarr-test
          done

      - name: Generate gateway descriptor
        run: |
          # Generate proto descriptor for gateway type discovery
          echo "Generating gateway descriptor from examples protos..."
          buf build examples-proto -o types.bin
          echo "Descriptor size: $(stat -c%s types.bin) bytes"

      - name: Create gateway descriptor ConfigMap
        run: |
          kubectl create configmap gateway-descriptor \
            --from-file=types.bin=types.bin \
            --namespace=angzarr-test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy infrastructure
        run: just deploy-infra

      - name: Deploy applications
        env:
          COORD_VERSION: ${{ inputs.coordinator-version }}
        run: |
          # Use Helm deploy with CI values (imagePullSecrets)
          just deploy-apps-ci latest "${COORD_VERSION}"

      - name: Run acceptance tests
        run: just test-e2e

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n angzarr-test -o wide
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n angzarr-test --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n angzarr-test -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs $pod -n angzarr-test --all-containers --tail=50 || true
          done
