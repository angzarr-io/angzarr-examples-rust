[package]
name = "table-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The blackjack table and its two policies on angzarr-embedded: scaffolded markup adapters over agg-table and table-player-policies"
# angzarr-embedded needs 1.85 (prost 0.14 through angzarr-proto).
rust-version = "1.85"

[dependencies]
agg-table.workspace = true
table-player-policies.workspace = true
examples-proto.workspace = true
angzarr-embedded.workspace = true
angzarr-embedded-macros.workspace = true
angzarr-embedded-diagnostic.workspace = true
prost.workspace = true

[dev-dependencies]
agg-table = { workspace = true, features = ["test-support"] }
# The remote Python player, hosted as a child process (tests/remote_player.rs).
angzarr-embedded-host.workspace = true
# The host's App is async, on the caller's runtime, which is tokio's
# (angzarr-embedded-host's own, already in the graph through it).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
