[package]
name = "examples-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The blackjack example's generated io.angzarr.examples.v1 layer: its wire types and the markup domain layer (cards, table, player, policies)"

[dependencies]
