[workspace]
resolver = "2"
# The example crates join this workspace as they are ported; tools/archlint
# checks their module layering (archlint.toml).
members = ["proto", "table/agg", "tools/archlint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[workspace.dependencies]
examples-proto = { path = "proto" }
bytes = "1"
prost = "0.14"
prost-build = "0.14"
