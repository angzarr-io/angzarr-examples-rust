[workspace]
resolver = "2"
# The example crates join this workspace as they are ported; tools/archlint
# checks their module layering (archlint.toml).
members = ["proto", "table/agg", "table/policies", "table/embedded", "tools/archlint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"

[workspace.dependencies]
examples-proto = { path = "proto" }
agg-table = { path = "table/agg" }
table-player-policies = { path = "table/policies" }
# angzarr-embedded (angzarr's in-app runtime) and its markup, pinned by hash
# on its main. angzarr-diagnostic is angzarr core's, at the rev embedded
# itself pins (as are its angzarr-proto, angzarr-ports and the router's), so
# one angzarr-diagnostic, one angzarr-proto and one angzarr-ports are in the
# graph. agg-table names diagnostics but never the runtime (archlint.toml),
# so it takes core's crate directly rather than embedded's re-export.
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "0bb53fc928bba9eb1fda43698b479e633e6ff2ec" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "0bb53fc928bba9eb1fda43698b479e633e6ff2ec" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "0bb53fc928bba9eb1fda43698b479e633e6ff2ec" }
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "ab3e9b50ab777f1c4d7269f2744b0a42bc3a6845" }
# angzarr-cli's build.rs helpers: the generated wire types, domain layer,
# adapters, register() and the remote player's stand-in, pinned by hash on
# poc/local-wiring, at the angzarr-proto and angzarr-diagnostic above.
angzarr-build = { git = "https://github.com/angzarr-io/angzarr-cli", rev = "ddb6a5be7258120f47b7dc86bf55133ccbf8fc33" }
prost = "0.14"
prost-build = "0.14"
# Matches the uuid angzarr-proto already brings into the graph.
uuid = { version = "1.29", default-features = false, features = ["v5"] }

# Complexity (architecture-fixes G3; taskloom's gate): clippy's defaults
# (cognitive complexity 25, 100 lines) except nesting, whose threshold is in
# clippy.toml. `just lint` denies warnings, and pre-commit runs it. Every
# crate inherits these (`[lints] workspace = true`).
[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
