[workspace]
resolver = "2"
# The example crates join this workspace as they are ported; tools/archlint
# checks their module layering (archlint.toml).
members = ["proto", "table/agg", "table/policies", "table/embedded", "tools/archlint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[workspace.dependencies]
examples-proto = { path = "proto" }
agg-table = { path = "table/agg" }
table-player-policies = { path = "table/policies" }
# angzarr-embedded (angzarr's in-app runtime) and its markup, pinned by hash
# on its main. Its angzarr-proto and angzarr-ports pins are the
# angzarr-project rev the angzarr-project submodule is checked out at, so one
# spec is in the graph.
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-embedded-host = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
angzarr-embedded-diagnostic = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "882ba3c5553eb83c4a5bc61869dc22d43eb704f1" }
bytes = "1"
prost = "0.14"
prost-build = "0.14"
# Matches the uuid angzarr-proto already brings into the graph.
uuid = { version = "1.29", default-features = false, features = ["v5"] }
